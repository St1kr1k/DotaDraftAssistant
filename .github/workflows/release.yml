# Собирает приложение на серверах GitHub и публикует установщик в Releases.
# Друг скачивает один файл:
#   https://github.com/<владелец>/<репозиторий>/releases/latest/download/DotaDraftAssistant-Installer.exe
#   (с выбором папки; или ...-win-Setup.exe — установка в одну кнопку в %LocalAppData%)
# Установленные копии обновляются сами.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:          # кнопка "Run workflow" во вкладке Actions
  schedule:
    - cron: '0 5 * * 3'       # раз в неделю: свежая статистика патча → новая версия → автообновление у всех

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
      REPO_URL: https://github.com/${{ github.repository }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Тесты
        run: dotnet test -c Release

      # Статистика патча обновляется раз в неделю: обычные обновления кода берут её из кэша
      # и не упираются в лимиты OpenDota.
      - name: Неделя для кэша данных
        id: week
        shell: pwsh
        run: echo "key=$(Get-Date -UFormat '%Y-w%V')" >> $env:GITHUB_OUTPUT

      - name: Кэш данных героев и патча
        id: datacache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/heroes
            data/patch
          key: dota-data-v3-${{ steps.week.outputs.key }}
          restore-keys: dota-data-

      - name: Данные героев и патча (OpenDota / Steam CDN)
        id: fetch
        if: steps.datacache.outputs.cache-hit != 'true'
        # Если OpenDota недоступен, а данные прошлой недели есть — релиз собирается на них (проверка ниже).
        continue-on-error: true
        run: dotnet run --project tools/DataTool -c Release -- fetch --out data

      - name: Проверка данных
        shell: pwsh
        run: |
          if (-not (Test-Path data/patch/meta.json)) { Write-Error "Нет данных патча: OpenDota недоступен и кэша нет"; exit 1 }
          if ("${{ steps.fetch.outcome }}" -eq "failure") { Write-Host "::warning::OpenDota недоступен — используются данные из кэша" }

      - name: Сохранить свежие данные в кэш
        if: steps.fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/heroes
            data/patch
          key: dota-data-v3-${{ steps.week.outputs.key }}

      # STRATZ: точные позиции, связки, исходы линий — только если в репозитории есть секрет STRATZ_TOKEN.
      # Все запросы идут из одной сборки: STRATZ пускает токен максимум с 2 IP за 15 минут.
      - name: Кэш данных STRATZ
        id: stratzcache
        uses: actions/cache/restore@v4
        with:
          path: data/patch/stratz_*.json
          key: stratz-v5-${{ steps.week.outputs.key }}
          restore-keys: stratz-v5-

      - name: Данные STRATZ
        id: stratz
        if: steps.stratzcache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: dotnet run --project tools/DataTool -c Release -- fetch-stratz --out data

      - name: Сохранить данные STRATZ в кэш
        if: steps.stratz.outcome == 'success' && hashFiles('data/patch/stratz_meta.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/patch/stratz_*.json
          key: stratz-v5-${{ steps.week.outputs.key }}

      - name: Публикация приложения
        run: >
          dotnet publish src/Presentation/DraftAssistant.Overlay.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:UpdateRepoUrl=${{ env.REPO_URL }}
          -o publish

      - name: Копия GSI-конфига в поставку
        shell: pwsh
        run: Copy-Item gsi/gamestate_integration_draftassistant.cfg publish/

      - name: Установка Velopack CLI
        run: dotnet tool install -g vpk

      - name: Предыдущий релиз (для дельта-обновлений)
        continue-on-error: true   # при самом первом релизе предыдущего нет
        run: vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка установщика
        run: >
          vpk pack
          --packId DotaDraftAssistant
          --packVersion ${{ env.VERSION }}
          --packDir publish
          --mainExe DotaDraftAssistant.exe
          --packTitle "Dota Draft Assistant"
          --icon src/Presentation/Assets/app.ico

      - name: Публикация в GitHub Releases
        run: >
          vpk upload github
          --repoUrl ${{ env.REPO_URL }}
          --publish
          --releaseName "Dota Draft Assistant ${{ env.VERSION }}"
          --tag v${{ env.VERSION }}
          --token ${{ secrets.GITHUB_TOKEN }}

      # Лёгкий установщик с выбором папки: качает последний Setup.exe и ставит его с --installto.
      - name: Установщик с выбором папки
        run: >
          dotnet publish tools/Installer/DraftAssistant.Installer.csproj
          -c Release
          -p:Version=${{ env.VERSION }}
          -p:UpdateRepoUrl=${{ env.REPO_URL }}
          -o installer

      - name: Добавить установщик в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ env.VERSION }} installer/DotaDraftAssistant-Installer.exe --clobber --repo ${{ github.repository }}
